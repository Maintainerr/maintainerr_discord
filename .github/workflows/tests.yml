name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # Decoder parity exercises the existing Discord and YAML dependencies.
      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: npm test
