name: pr-check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this workflow builds but never pushes, and runs untrusted code
    # from fork pull requests.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: maintainerr_discord:pr

      # Runs under the image's own Node, so the check always matches the
      # version production actually runs rather than a separately pinned one.
      - name: Syntax check sources
        run: |
          docker run --rm maintainerr_discord:pr \
            sh -c 'for f in src/*.js; do node --check "$f" || exit 1; done'
