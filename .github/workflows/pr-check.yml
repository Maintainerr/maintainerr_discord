name: pr-check

# Every pull request, not only those targeting main: phase work is reviewed as
# a stack of chained branches, and filtering to main skipped the image build on
# all but the first one.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this workflow builds but never pushes, and runs untrusted code
    # from fork pull requests.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # buildah rather than docker/buildx -- this project is podman-only.
      - name: Build image without pushing
        uses: redhat-actions/buildah-build@v3
        with:
          image: maintainerr_discord
          tags: pr
          containerfiles: ./Containerfile
          context: .

      # Runs under the image's own Node, so the check always matches the
      # version production actually runs rather than a separately pinned one.
      - name: Syntax check sources
        run: |
          podman run --rm maintainerr_discord:pr \
            find src -type f -name '*.js' \
              -exec sh -c 'for f do node --check "$f" || exit 1; done' sh {} +
